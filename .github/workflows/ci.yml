name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tax-service .
      - name: Smoke test container
        run: |
          docker run -d --name tax-service -p 3000:3000 tax-service
          for i in $(seq 1 20); do curl -fsS localhost:3000/health && exit 0; sleep 1; done
          docker logs tax-service
          exit 1
