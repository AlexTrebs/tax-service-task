services:
  tax-service:
    build: .
    ports:
      - "3000:3000"
    environment:
      LOG_LEVEL: info
      SHUTDOWN_DELAY_MS: 3000
    volumes:
      - tax-data:/app/data
    stop_grace_period: 15s

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - tax-service

volumes:
  tax-data:
